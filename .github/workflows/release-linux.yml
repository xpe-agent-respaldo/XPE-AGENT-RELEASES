name: Build XPE Agent para Linux (.deb y .AppImage)

# Corre DESPUES del build de Windows (workflow_run), añade sus artefactos
# al MISMO release y amplía latest.json con la plataforma linux-x86_64.
on:
  workflow_run:
    workflows: ["Build & Release XPE Agent (.exe con auto-update)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente (ej: v1.0.27)'
        required: true

jobs:
  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Determinar tag y version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # Tras el build de Windows: usar la ultima release creada en ESTE repo
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$TAG" ]; then echo "No se pudo determinar el tag"; exit 1; fi
          fi
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version invalida: '$VERSION' (debe ser semver, ej 1.0.27)"; exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout del código FUENTE (repo privado XPE-AGENT-SRC)
        uses: actions/checkout@v4
        with:
          repository: xpe-agent/XPE-AGENT-SRC
          token: ${{ secrets.SRC_PAT }}
          ref: ${{ steps.ver.outputs.tag }}

      - name: Dependencias del sistema (WebKitGTK para Tauri v1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Version en tauri.conf.json y Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            c.package.version='${{ steps.ver.outputs.version }}';
            c.tauri.bundle.targets=['deb','appimage','updater'];
            fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2));
          "
          sed -i "s/^version = \"[^\"]*\"/version = \"${{ steps.ver.outputs.version }}\"/" src-tauri/Cargo.toml

      - name: Compilar backend standalone (sidecar Linux)
        run: bun build --compile server.ts --outfile src-tauri/binaries/xpe-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri (Linux)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
        run: npm run tauri build

      - name: Subir artefactos de Linux al release (mismo repo publico)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Añadir linux a latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO=xpe-agent-respaldo/XPE-AGENT-RELEASES
          TAG="${{ steps.ver.outputs.tag }}"
          B=src-tauri/target/release/bundle
          gh release download "$TAG" --repo $REPO --pattern latest.json --clobber || true
          AI=$(basename $B/appimage/*.AppImage.tar.gz 2>/dev/null || echo "")
          SIG=$(cat $B/appimage/*.AppImage.tar.gz.sig 2>/dev/null || echo "")
          if [ -n "$AI" ] && [ -n "$SIG" ]; then
            XPE_TAG="$TAG" XPE_AI="$AI" XPE_SIG="$SIG" python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("latest.json")
          if p.exists():
              try:
                  m = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  m = {"version": os.environ["XPE_TAG"].lstrip("v"), "platforms": {}}
          else:
              m = {"version": os.environ["XPE_TAG"].lstrip("v"), "platforms": {}}
          m.setdefault("platforms", {})["linux-x86_64"] = {
              "signature": os.environ["XPE_SIG"],
              "url": f"https://github.com/xpe-agent-respaldo/XPE-AGENT-RELEASES/releases/download/{os.environ['XPE_TAG']}/{os.environ['XPE_AI']}"
          }
          try:
              m["body"] = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          except Exception:
              pass
          p.write_text(json.dumps(m, indent=2, ensure_ascii=False), encoding="utf-8")
          PY
            gh release upload "$TAG" latest.json --repo $REPO --clobber || true
          fi
