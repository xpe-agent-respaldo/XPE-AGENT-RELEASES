name: Auto-release XPE Agent (version nueva, builds y correos)

# Un solo boton para todo el flujo de versiones:
#   1. Lee la version de package.json en el repo fuente (XPE-AGENT-SRC).
#   2. Si esa version no tiene tag, lo crea.
#   3. Si esa version no tiene release, lanza Windows, macOS y Linux.
#   4. Espera a que existan los instaladores y dispara los correos de novedades.
# Revisa cada 2 horas por si subiste la version, y tambien se puede lanzar a mano.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (vacio = la de package.json)'
        required: false
        default: ''
      force:
        description: 'Reconstruir aunque el release ya exista (true/false)'
        required: false
        default: 'false'

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Detectar version y estado
        id: detect
        env:
          SRC_PAT: ${{ secrets.SRC_PAT }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          SRC=xpe-agent/XPE-AGENT-SRC
          REL=xpe-agent-respaldo/XPE-AGENT-RELEASES
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then
            V=$(curl -s -H "Authorization: Bearer $SRC_PAT" \
              "https://raw.githubusercontent.com/$SRC/main/package.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT

          # Tag en el repo fuente (el build clona por tag).
          HASSRC=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $SRC_PAT" \
            "https://api.github.com/repos/$SRC/git/ref/tags/v$V")
          if [ "$HASSRC" != "200" ]; then
            SHA=$(curl -s -H "Authorization: Bearer $SRC_PAT" "https://api.github.com/repos/$SRC/git/ref/heads/main" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['object']['sha'])")
            curl -s -X POST -H "Authorization: Bearer $SRC_PAT" -H "Content-Type: application/json" \
              "https://api.github.com/repos/$SRC/git/refs" \
              -d "{\"ref\":\"refs/tags/v$V\",\"sha\":\"$SHA\"}" >/dev/null
            echo "Tag v$V creado en el repo fuente."
          fi

          # Release ya publicado?
          HASREL=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REL/releases/tags/v$V")
          if [ "$HASREL" = "200" ] && [ "$INPUT_FORCE" != "true" ]; then
            echo "need=false" >> $GITHUB_OUTPUT
            echo "La version $V ya tiene release publicado."
          else
            echo "need=true" >> $GITHUB_OUTPUT
            echo "Hay que compilar la version $V."
          fi

      - name: Lanzar builds (Windows, macOS y Linux)
        if: steps.detect.outputs.need == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.detect.outputs.version }}
        run: |
          REL=xpe-agent-respaldo/XPE-AGENT-RELEASES
          dispatch() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REL/actions/workflows/$1/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":$2}"
          }
          echo "Windows: $(dispatch release.yml "{\"version\":\"$V\",\"ref\":\"v$V\"}")"
          echo "macOS:   $(dispatch release-mac.yml "{\"version\":\"$V\",\"ref\":\"v$V\"}")"
          echo "Linux:   $(dispatch release-linux.yml "{\"tag\":\"v$V\",\"ref\":\"v$V\"}")"

      - name: Esperar a que esten los instaladores
        if: steps.detect.outputs.need == 'true'
        id: wait
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.detect.outputs.version }}
        run: |
          REL=xpe-agent-respaldo/XPE-AGENT-RELEASES
          for i in $(seq 1 55); do
            NAMES=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$REL/releases/tags/v$V" \
              | python3 -c "import json,sys;print(' '.join(a['name'] for a in json.load(sys.stdin).get('assets',[])))" 2>/dev/null || true)
            EXE=no; DEB=no; DMG=no; UPD=no
            case "$NAMES" in *setup.exe*) EXE=si;; esac
            case "$NAMES" in *.deb*) DEB=si;; esac
            case "$NAMES" in *.dmg*) DMG=si;; esac
            case "$NAMES" in *latest.json*) UPD=si;; esac
            echo "intento $i: exe=$EXE deb=$DEB dmg=$DMG latest=$UPD"
            if [ "$EXE" = si ] && [ "$DEB" = si ] && [ "$UPD" = si ]; then
              echo "ready=true" >> $GITHUB_OUTPUT
              break
            fi
            sleep 120
          done
          if [ -z "$(grep ready $GITHUB_OUTPUT 2>/dev/null)" ]; then echo "ready=false" >> $GITHUB_OUTPUT; fi

      - name: Avisar correos de la version nueva
        if: steps.detect.outputs.need == 'true'
        env:
          ADMIN: ${{ secrets.XPE_ADMIN_KEY }}
          V: ${{ steps.detect.outputs.version }}
          READY: ${{ steps.wait.outputs.ready }}
        run: |
          if [ "$READY" != "true" ]; then
            echo "Los builds aun no terminaron; los correos se envian solos al arrancar el servidor con whatsnew.json."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/ann.json -w "%{http_code}" -m 120 -X POST \
            -H "Content-Type: application/json" -H "x-xpe-admin: $ADMIN" \
            https://xpe-agent-server.onrender.com/api/news/announce-auto -d '{}')
          echo "announce HTTP $CODE"; cat /tmp/ann.json | head -c 400

      - name: Resumen
        run: |
          echo "### XPE Agent ${{ steps.detect.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release necesario: ${{ steps.detect.outputs.need }}" >> $GITHUB_STEP_SUMMARY
          echo "- Instaladores listos: ${{ steps.wait.outputs.ready }}" >> $GITHUB_STEP_SUMMARY
