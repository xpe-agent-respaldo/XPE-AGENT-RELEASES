name: Auto-release XPE Agent (escritorio)

# Sin intervencion de nadie. Cada 30 min mira el codigo fuente:
#  - si package.json ya trae una version mayor que la ultima release -> la publica;
#  - si hay cambios que afectan al exe desde la ultima release, el ultimo cambio
#    tiene al menos 45 min (la tanda de trabajo termino) y la ultima release tiene
#    al menos 2 h -> sube el parche (1.2.13 -> 1.2.14) en el fuente, crea el tag
#    y lanza el build de Windows; Linux se encadena solo despues.
# Nunca corre dos releases a la vez.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar ya aunque no haya pasado el tiempo de espera"
        type: boolean
        default: false

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  auto:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar fuente
        uses: actions/checkout@v4
        with:
          repository: xpe-agent-respaldo/XPE-AGENT
          token: ${{ secrets.SRC_PUSH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Decidir si toca version nueva
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, datetime, re
          def sh(*a): return subprocess.run(a, capture_output=True, text=True).stdout.strip()
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          def fin(**kv):
              for k, v in kv.items(): out.write(f"{k}={v}\n")
              print(kv); raise SystemExit(0)
          repo = os.environ["GITHUB_REPOSITORY"]
          # 1) nada de releases solapadas
          for wf in ("release.yml", "release-linux.yml"):
              for st in ("in_progress", "queued"):
                  n = sh("gh", "run", "list", "-R", repo, "-w", wf, "-s", st, "--json", "databaseId", "--jq", "length")
                  if n and n != "0": fin(go="0", why=f"{wf} {st}")
          rel = json.loads(sh("gh", "release", "view", "-R", repo, "--json", "tagName,publishedAt") or "{}")
          last = rel.get("tagName", "v0.0.0").lstrip("v")
          pub = datetime.datetime.fromisoformat(rel.get("publishedAt", "2000-01-01T00:00:00Z").replace("Z", "+00:00")).timestamp()
          V = lambda s: tuple(int(x) for x in re.findall(r"\d+", s)[:3])
          src = json.load(open("package.json"))["version"]
          if V(src) > V(last): fin(go="1", bump="0", version=src, why=f"fuente {src} > release {last}")
          # 2) cambios que afectan al exe desde la ultima release
          base = sh("git", "rev-list", "-n1", f"v{last}") or sh("git", "rev-list", "-n1", f"--before={int(pub)}", "HEAD")
          rel_paths = ("src/", "src-tauri/", "public/", "index.html", "package.json", "package-lock.json", "vite.config")
          files = [f for f in sh("git", "diff", "--name-only", f"{base}..HEAD").splitlines() if f.startswith(rel_paths)]
          if not files: fin(go="0", why="sin cambios para el exe")
          last_commit = int(sh("git", "log", "-1", "--format=%ct", "HEAD", "--", *rel_paths) or 0)
          now = time.time()
          if os.environ.get("FORCE") != "true":
              if now - last_commit < 45 * 60: fin(go="0", why="hay trabajo en curso, espero 45 min de calma")
              if now - pub < 2 * 3600: fin(go="0", why="la ultima release tiene menos de 2 h")
          a, b, c = V(last)
          fin(go="1", bump="1", version=f"{a}.{b}.{c+1}", base=base, why=f"{len(files)} archivos cambiados")
          PY

      - name: Subir version en el fuente y crear tag
        if: steps.d.outputs.go == '1'
        env:
          VER: ${{ steps.d.outputs.version }}
          BUMP: ${{ steps.d.outputs.bump }}
          BASE: ${{ steps.d.outputs.base }}
        run: |
          git config user.name "XPE Agent Release"
          git config user.email "release@xpe-agent.local"
          if [ "$BUMP" = "1" ]; then
            node -e '
            const fs=require("fs"), v=process.env.VER;
            const j=(f,fn)=>{ if(!fs.existsSync(f)) return; const o=JSON.parse(fs.readFileSync(f,"utf8")); fn(o); fs.writeFileSync(f, JSON.stringify(o,null,2)+"\n"); };
            j("package.json", o=>o.version=v);
            j("package-lock.json", o=>{o.version=v; if(o.packages&&o.packages[""]) o.packages[""].version=v;});
            j("src-tauri/tauri.conf.json", o=>{ if(o.package) o.package.version=v; else o.version=v; });
            j("public/version.json", o=>{o.version=v; o.releaseName="XPE Agent "+v;});
            j("public/whatsnew.json", o=>{o.version=v; o.date=new Date().toISOString().slice(0,10);});'
            sed -i "0,/^version = \"[^\"]*\"/s//version = \"$VER\"/" src-tauri/Cargo.toml
            # Notas de la version a partir de los commits (sin hashes ni nombres de terceros)
            {
              echo "# XPE Agent $VER"; echo
              git log --no-merges --format='%s' "$BASE..HEAD" \
                | grep -viE '^(merge|revert|chore\(release\))' \
                | sed -E 's/^(feat|fix|perf|refactor|ui|security|sec)(\([^)]*\))?!?: */- /I; t; d' \
                | head -25
            } > RELEASE_NOTES.md
            [ "$(wc -l < RELEASE_NOTES.md)" -gt 2 ] || echo "- Mejoras de estabilidad y rendimiento." >> RELEASE_NOTES.md
            git add -A package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml public/version.json public/whatsnew.json RELEASE_NOTES.md
            git commit -m "chore(release): v$VER [skip ci]"
            for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase origin main; done
          fi
          git tag -f "v$VER"
          git push -f origin "v$VER"

      - name: Lanzar build de escritorio y refrescar la web
        if: steps.d.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.d.outputs.version }}
        run: |
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" -f version="$VER"
          gh workflow run deploy-web.yml -R "$GITHUB_REPOSITORY" -f ref=main
          echo "Lanzado v$VER (Windows -> Linux encadenado) y web"
