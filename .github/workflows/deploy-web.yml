name: Desplegar web XPE Agent (Cloudflare Pages)

# Repo PUBLICO: Actions es gratis e ilimitado aqui. Compila el fuente y publica la web.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o commit del espejo a publicar"
        default: "main"
  schedule:
    - cron: "17 */6 * * *"   # revisa cada 6 h si hay commit nuevo

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar fuente
        uses: actions/checkout@v4
        with:
          repository: xpe-agent-respaldo/XPE-AGENT
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Saber si ya esta publicado este commit
        id: chk
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          LIVE=$(curl -s https://xpe-agent.pages.dev/version.json | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit',''))" || echo "")
          echo "sha=$SHA live=$LIVE"
          if [ "$SHA" = "$LIVE" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=1" >> $GITHUB_OUTPUT; else echo "skip=0" >> $GITHUB_OUTPUT; fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        if: steps.chk.outputs.skip != '1'
        run: npm ci

      - name: Version de la build
        if: steps.chk.outputs.skip != '1'
        run: |
          node -e "
          const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          fs.writeFileSync('public/version.json',JSON.stringify({version:pkg.version,buildTime:Date.now(),commit:'${{ steps.chk.outputs.sha }}',releaseName:'XPE Agent '+pkg.version,channel:'production'},null,2));
          try{const wn=JSON.parse(fs.readFileSync('public/whatsnew.json','utf8'));wn.version=pkg.version;wn.date=new Date().toISOString().slice(0,10);fs.writeFileSync('public/whatsnew.json',JSON.stringify(wn,null,2));}catch(e){}"

      - name: Compilar web
        if: steps.chk.outputs.skip != '1'
        run: npx vite build && node scripts/obfuscate-web.cjs

      - name: Publicar en Cloudflare Pages
        if: steps.chk.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 pages deploy dist --project-name=xpe-agent --commit-dirty=true
