name: Build & Release XPE Agent (.exe con auto-update)

# Este repositorio es PUBLICO: GitHub Actions corre GRATIS e ilimitado aqui.
# El codigo fuente se clona desde el repo PRINCIPAL xpe-agent-respaldo/XPE-AGENT (XPE-AGENT-SRC y Hugging Face son solo respaldo)
# usando una deploy key SSH de SOLO LECTURA (SRC_DEPLOY_KEY) del repo principal.
run-name: Build XPE Agent ${{ github.event.client_payload.tag || github.event.inputs.version || github.ref_name }}

on:
  # Flujo de versiones AUTOMATICO: al empujar un tag vX.Y.Z aqui, se compila y publica
  # solo (Windows, despues Linux y despues macOS). El dispatch manual sigue disponible como respaldo.
  push:
    tags:
      - 'v*'
  # El repo principal avisa al instante cuando alguien empuja un tag vX.Y.Z (o vX.Y.Z-rc.N)
  repository_dispatch:
    types: [source-tag]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (debe existir el tag v<version> en xpe-agent-respaldo/XPE-AGENT)'
        required: true
        default: '1.0.27'
      ref:
        description: 'Rama o tag del codigo (vacio = tag de la version)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Determinar versión
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          P_TAG: ${{ github.event.client_payload.tag }}
          I_VER: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$P_TAG" ]; then TAG="$P_TAG"
          elif [ -n "$I_VER" ]; then TAG="v${I_VER#v}"
          else TAG="$GITHUB_REF_NAME"; fi
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/.github/scripts/xpe_version.py" -o xpe_version.py
          python xpe_version.py "$TAG" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
          # Nunca compilar dos veces la misma version
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.exe$'; then
            echo "skip=1" >> $GITHUB_OUTPUT; echo "La $TAG ya tiene instalador de Windows: no se recompila."
          else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - name: Checkout del código FUENTE (repo principal XPE-AGENT)
        if: steps.ver.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          repository: xpe-agent-respaldo/XPE-AGENT
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          ref: ${{ github.event.inputs.ref || steps.ver.outputs.tag }}

      - name: Setup Node.js
        if: steps.ver.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun (para compilar el backend standalone)
        if: steps.ver.outputs.skip != '1'
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        if: steps.ver.outputs.skip != '1'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.ver.outputs.skip != '1'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        if: steps.ver.outputs.skip != '1'
        run: npm ci

      - name: Escribir versión en tauri.conf.json y Cargo.toml
        if: steps.ver.outputs.skip != '1'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const ver = '${{ steps.ver.outputs.version }}';
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            if (conf.package) { conf.package.version = ver; } else { conf.version = ver; }
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "
          sed -i "s/^version = \"[^\"]*\"/version = \"${{ steps.ver.outputs.version }}\"/" src-tauri/Cargo.toml
          cat src-tauri/Cargo.toml | head -3

      - name: Compilar backend standalone (sidecar XPE)
        if: steps.ver.outputs.skip != '1'
        shell: bash
        run: |
          bun build --compile server.ts --outfile src-tauri/binaries/xpe-backend-x86_64-pc-windows-msvc.exe
          ls -la src-tauri/binaries/

      - name: Build Tauri App (.msi + .exe firmados para auto-update)
        if: steps.ver.outputs.skip != '1'
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
          TAURI_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_PASSWORD }}
        run: npm run tauri build

      - name: Buscar artefactos generados
        if: steps.ver.outputs.skip != '1'
        id: files
        shell: bash
        run: |
          set +e
          ROOT=src-tauri/target/release/bundle
          MSI=$(ls $ROOT/msi/*.msi 2>/dev/null | head -1)
          EXE=$(ls $ROOT/nsis/*.exe 2>/dev/null | head -1)
          EXESIG=$(ls $ROOT/nsis/*.exe.sig 2>/dev/null | head -1)
          ZIP=$(ls $ROOT/msi/*.msi.zip 2>/dev/null | head -1)
          SIG=$(ls $ROOT/msi/*.msi.zip.sig 2>/dev/null | head -1)
          echo "msi=$MSI"; echo "exe=$EXE"; echo "exesig=$EXESIG"
          echo "msi_path=$MSI" >> $GITHUB_OUTPUT
          echo "msi_name=$(basename "${MSI:-x}")" >> $GITHUB_OUTPUT
          echo "exe_path=$EXE" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "${EXE:-x}")" >> $GITHUB_OUTPUT
          echo "exe_sig_path=$EXESIG" >> $GITHUB_OUTPUT
          echo "zip_name=$(basename "${ZIP:-}")" >> $GITHUB_OUTPUT
          echo "sig_path=$SIG" >> $GITHUB_OUTPUT
          ls -la $ROOT/msi $ROOT/nsis || true
          test -n "$MSI" || { echo "No se genero instalador"; exit 1; }

      - name: Generar latest.json (manifest del auto-updater)
        if: steps.ver.outputs.skip != '1'
        shell: bash
        run: |
          export XPE_VERSION="${{ steps.ver.outputs.version }}" XPE_TAG="${{ steps.ver.outputs.tag }}"
          export XPE_EXE="${{ steps.files.outputs.exe_name }}" XPE_EXE_SIG_PATH="${{ steps.files.outputs.exe_sig_path }}"
          export XPE_ZIP="${{ steps.files.outputs.zip_name }}" XPE_SIG_PATH="${{ steps.files.outputs.sig_path }}"
          python3 - <<'PYEOF'
          import json, os, pathlib, datetime, urllib.parse
          body = ""
          for cand in ("RELEASE_NOTES.md", "docs/RELEASE_NOTES.md"):
              p = pathlib.Path(cand)
              if p.exists():
                  body = p.read_text(encoding="utf-8").strip(); break
          if not body:
              body = f"Nueva version {os.environ['XPE_VERSION']} de XPE Agent con mejoras para ti."
          exe = os.environ.get("XPE_EXE") or ""
          exe_sig_path = os.environ.get("XPE_EXE_SIG_PATH") or ""
          zip_name = os.environ.get("XPE_ZIP") or ""
          sig_path = os.environ.get("XPE_SIG_PATH") or ""
          url = None; sig = ""
          if exe and exe_sig_path and pathlib.Path(exe_sig_path).exists():
              sig = pathlib.Path(exe_sig_path).read_text(encoding="utf-8").strip()
              url = f"https://github.com/xpe-agent-respaldo/XPE-AGENT-RELEASES/releases/download/{os.environ['XPE_TAG']}/{urllib.parse.quote(exe)}"
          elif zip_name and sig_path and pathlib.Path(sig_path).exists():
              sig = pathlib.Path(sig_path).read_text(encoding="utf-8").strip()
              url = f"https://github.com/xpe-agent-respaldo/XPE-AGENT-RELEASES/releases/download/{os.environ['XPE_TAG']}/{urllib.parse.quote(zip_name)}"
          if not url:
              raise SystemExit("No hay artefacto firmado para el actualizador")
          manifest = {
              "version": os.environ["XPE_VERSION"],
              "body": body,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": {"signature": sig, "url": url}},
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("latest.json ->", manifest["version"], url)
          PYEOF

      - name: Ajustar latest.json al nombre real del instalador
        if: steps.ver.outputs.skip != '1'
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os
          m = json.load(open("latest.json", encoding="utf-8"))
          for plat, info in (m.get("platforms") or {}).items():
              url = info.get("url", "")
              # Tauri nombra el archivo con puntos donde el productName tiene espacios
              fixed = url.replace("%20", ".").replace(" ", ".")
              info["url"] = fixed
              print(plat, "->", fixed)
          json.dump(m, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PYEOF

      - name: Crear GitHub Release (en ESTE repo publico)
        if: steps.ver.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: XPE Agent ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lanzar el build de Linux (mismo release)
        if: steps.ver.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-linux.yml -R "$GITHUB_REPOSITORY" -f tag="${{ steps.ver.outputs.tag }}" -f chain_macos=1
