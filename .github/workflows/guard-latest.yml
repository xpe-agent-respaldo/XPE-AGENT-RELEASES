name: Candado de actualizaciones (el ultimo release siempre es el de escritorio)

# Un release de movil, una prueba o cualquier etiqueta que no sea vX.Y.Z puede
# quitarle el puesto de "ultimo release" al instalador de escritorio y entonces
# la app deja de ver actualizaciones. Este candado lo impide solo.
on:
  release:
    types: [published]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candado:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar todos los releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh api "repos/$REPO/releases?per_page=100" > rel.json
          python3 - <<'PY'
          import json, os, re, subprocess
          rels = json.load(open("rel.json"))
          repo = os.environ["REPO"]
          pat = re.compile(r'^v\d+\.\d+\.\d+$')
          for r in rels:
              tag, rid, pre = r["tag_name"], r["id"], r["prerelease"]
              if not pat.match(tag) and not pre:
                  subprocess.run(["gh","api","-X","PATCH",
                                  f"repos/{repo}/releases/{rid}",
                                  "-f","prerelease=true"], check=True)
                  print("marcado como previo:", tag)
          # el release mas alto vX.Y.Z no puede quedar como previo
          vrels = [r for r in rels if pat.match(r["tag_name"])]
          if vrels:
              top = max(vrels, key=lambda r: [int(x) for x in r["tag_name"][1:].split(".")])
              if top["prerelease"]:
                  subprocess.run(["gh","api","-X","PATCH",
                                  f"repos/{repo}/releases/{top['id']}",
                                  "-f","prerelease=false"], check=True)
                  print("restaurado como ultimo:", top["tag_name"])
          print("revisados:", len(rels))
          PY
